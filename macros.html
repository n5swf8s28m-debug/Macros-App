<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macros</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Macros">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --text: #e8e8e8;
    --muted: #666;
    --protein: #4ade80;
    --carbs: #60a5fa;
    --fat: #f97316;
    --cal: #a78bfa;
    --danger: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    padding: 32px 16px 80px;
  }

  .container { max-width: 520px; margin: 0 auto; }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 28px;
  }
  header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
  .date-label { color: var(--muted); font-size: 13px; }

  /* Goal bar section */
  .summary {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .macro-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }

  .macro-stat { text-align: center; }
  .macro-stat .val {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .macro-stat .label { color: var(--muted); font-size: 11px; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
  .macro-stat .goal-rem { font-size: 11px; margin-top: 2px; }

  .c-protein { color: var(--protein); }
  .c-carbs   { color: var(--carbs); }
  .c-fat     { color: var(--fat); }
  .c-cal     { color: var(--cal); }

  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-label { width: 52px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .bar-track {
    flex: 1;
    height: 5px;
    background: var(--surface2);
    border-radius: 99px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.35s ease;
    max-width: 100%;
  }
  .bar-pct { font-size: 11px; color: var(--muted); width: 30px; text-align: right; }

  /* Goals editor */
  .goals-toggle {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0;
  }
  .goals-toggle:hover { color: var(--text); }

  .goals-panel {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    display: none;
  }
  .goals-panel.open { display: block; }
  .goals-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .goals-grid label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
  .goals-grid input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    padding: 8px 8px;
    text-align: center;
    outline: none;
  }
  .goals-grid input:focus { border-color: #444; }

  /* Add food form */
  .add-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 20px;
  }

  .add-card h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-bottom: 14px; }

  .name-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .food-search-wrap { flex: 1; position: relative; }

  .form-name {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text);
    font-size: 15px;
    padding: 10px 12px;
    outline: none;
  }
  .form-name::placeholder { color: var(--muted); }
  .form-name:focus { border-color: #444; }

  .autocomplete-drop {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 9px;
    overflow: hidden;
    z-index: 100;
    max-height: 210px;
    overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .autocomplete-drop.open { display: block; }
  .ac-item {
    padding: 10px 13px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover, .ac-item.highlighted { background: var(--surface); }

  .amount-wrap { position: relative; width: 100px; flex-shrink: 0; }
  .amount-wrap input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    padding: 10px 42px 10px 10px;
    outline: none;
  }
  .amount-wrap input:focus { border-color: #444; }
  .unit-toggle {
    position: absolute; right: 0; top: 0; bottom: 0;
    display: flex; flex-direction: column;
    border-left: 1px solid var(--border);
    border-radius: 0 9px 9px 0;
    overflow: hidden;
  }
  .unit-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    padding: 0 7px;
    letter-spacing: 0.3px;
    line-height: 1;
    transition: background 0.1s, color 0.1s;
  }
  .unit-btn:first-child { border-bottom: 1px solid var(--border); }
  .unit-btn.active { color: var(--text); background: var(--surface); }
  .unit-btn:hover:not(.active) { color: #999; }

  .form-macros {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }

  .macro-input-wrap { position: relative; }
  .macro-input-wrap input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    padding: 10px 28px 10px 10px;
    outline: none;
  }
  .macro-input-wrap input:focus { border-color: #444; }
  .macro-input-wrap input::placeholder { color: var(--muted); font-weight: 400; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  .macro-input-wrap .unit {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    color: var(--muted);
    pointer-events: none;
  }
  .macro-input-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    padding-left: 2px;
  }

  .cal-preview {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 12px;
    padding-left: 2px;
    min-height: 16px;
  }
  .cal-preview span { color: var(--cal); font-weight: 500; }

  .btn-add {
    width: 100%;
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    padding: 11px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-add:hover { opacity: 0.88; }
  .btn-add:active { opacity: 0.75; }

  /* Log */
  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .log-header h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); }
  .btn-clear {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    padding: 0;
  }
  .btn-clear:hover { color: var(--danger); }

  .log-empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }

  .log-list { display: flex; flex-direction: column; gap: 6px; }

  .log-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    animation: fadeIn 0.18s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .log-item-name {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .log-item-macros {
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  .log-macro {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }

  .log-item-cal {
    font-size: 12px;
    color: var(--cal);
    font-weight: 500;
    white-space: nowrap;
    min-width: 46px;
    text-align: right;
  }

  .btn-del {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 16px;
    line-height: 1;
    padding: 0 0 0 4px;
    flex-shrink: 0;
    transition: color 0.12s;
  }
  .btn-del:hover { color: var(--danger); }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>Macros</h1>
    <span class="date-label" id="dateLabel"></span>
  </header>

  <!-- Summary -->
  <div class="summary">
    <div class="macro-row">
      <div class="macro-stat">
        <div class="val c-protein" id="totP">0</div>
        <div class="label">Protein</div>
        <div class="goal-rem c-protein" id="remP"></div>
      </div>
      <div class="macro-stat">
        <div class="val c-carbs" id="totC">0</div>
        <div class="label">Carbs</div>
        <div class="goal-rem c-carbs" id="remC"></div>
      </div>
      <div class="macro-stat">
        <div class="val c-fat" id="totF">0</div>
        <div class="label">Fat</div>
        <div class="goal-rem c-fat" id="remF"></div>
      </div>
      <div class="macro-stat">
        <div class="val c-cal" id="totKcal">0</div>
        <div class="label">kcal</div>
        <div class="goal-rem c-cal" id="remKcal"></div>
      </div>
    </div>

    <div class="bars">
      <div class="bar-row">
        <span class="bar-label">Protein</span>
        <div class="bar-track"><div class="bar-fill" id="barP" style="background:var(--protein);width:0%"></div></div>
        <span class="bar-pct" id="pctP">0%</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Carbs</span>
        <div class="bar-track"><div class="bar-fill" id="barC" style="background:var(--carbs);width:0%"></div></div>
        <span class="bar-pct" id="pctC">0%</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Fat</span>
        <div class="bar-track"><div class="bar-fill" id="barF" style="background:var(--fat);width:0%"></div></div>
        <span class="bar-pct" id="pctF">0%</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Calories</span>
        <div class="bar-track"><div class="bar-fill" id="barK" style="background:var(--cal);width:0%"></div></div>
        <span class="bar-pct" id="pctK">0%</span>
      </div>
    </div>

    <button class="goals-toggle" id="goalsToggle" onclick="toggleGoals()">
      <span id="goalsArrow">▸</span> Daily Goals
    </button>
    <div class="goals-panel" id="goalsPanel">
      <div class="goals-grid">
        <div>
          <label>Protein g</label>
          <input type="number" id="goalP" min="0" placeholder="150" oninput="saveGoals()">
        </div>
        <div>
          <label>Carbs g</label>
          <input type="number" id="goalC" min="0" placeholder="200" oninput="saveGoals()">
        </div>
        <div>
          <label>Fat g</label>
          <input type="number" id="goalF" min="0" placeholder="65" oninput="saveGoals()">
        </div>
        <div>
          <label>Calories</label>
          <input type="number" id="goalK" min="0" placeholder="2000" oninput="saveGoals()">
        </div>
      </div>
    </div>
  </div>

  <!-- Add food -->
  <div class="add-card">
    <h2>Add Food</h2>
    <div class="name-row">
      <div class="food-search-wrap">
        <input class="form-name" type="text" id="foodName" placeholder="Search food…" autocomplete="off" />
        <div class="autocomplete-drop" id="autocompleteDrop"></div>
      </div>
      <div class="amount-wrap">
        <input type="number" id="foodAmount" placeholder="amt" min="0">
        <div class="unit-toggle">
          <button class="unit-btn active" id="btnG" type="button" onclick="setUnit('g')">g</button>
          <button class="unit-btn" id="btnOz" type="button" onclick="setUnit('oz')">oz</button>
        </div>
      </div>
    </div>
    <div class="form-macros">
      <div class="macro-input-wrap">
        <div class="macro-input-label c-protein">Protein</div>
        <input type="number" id="inP" min="0" step="0.1" placeholder="0" oninput="updateCalPreview()">
        <span class="unit">g</span>
      </div>
      <div class="macro-input-wrap">
        <div class="macro-input-label c-carbs">Carbs</div>
        <input type="number" id="inC" min="0" step="0.1" placeholder="0" oninput="updateCalPreview()">
        <span class="unit">g</span>
      </div>
      <div class="macro-input-wrap">
        <div class="macro-input-label c-fat">Fat</div>
        <input type="number" id="inF" min="0" step="0.1" placeholder="0" oninput="updateCalPreview()">
        <span class="unit">g</span>
      </div>
    </div>
    <div class="cal-preview" id="calPreview"></div>
    <button class="btn-add" type="button" onclick="addEntry()">Add</button>
  </div>

  <!-- Log -->
  <div class="log-header">
    <h2>Today's Log</h2>
    <button class="btn-clear" onclick="clearLog()">Clear all</button>
  </div>
  <div id="logArea"></div>

</div>

<script>
  const FOODS = [
    { name: 'Chicken Breast (cooked)',       p: 31,  c: 0,    f: 3.6 },
    { name: 'Ground Beef 80/20 (cooked)',    p: 26,  c: 0,    f: 20  },
    { name: 'Ground Turkey (cooked)',        p: 27,  c: 0,    f: 7   },
    { name: 'Salmon (cooked)',               p: 25,  c: 0,    f: 13  },
    { name: 'Tuna (canned in water)',        p: 25,  c: 0,    f: 0.8 },
    { name: 'Tilapia (cooked)',              p: 26,  c: 0,    f: 2.7 },
    { name: 'Shrimp (cooked)',               p: 24,  c: 0.2,  f: 1.7 },
    { name: 'Turkey Breast (cooked)',        p: 29,  c: 0,    f: 1   },
    { name: 'Pork Loin (cooked)',            p: 29,  c: 0,    f: 9   },
    { name: 'Steak (sirloin, cooked)',       p: 30,  c: 0,    f: 10  },
    { name: 'Eggs (whole)',                  p: 13,  c: 1.1,  f: 11  },
    { name: 'Egg Whites',                    p: 11,  c: 0.7,  f: 0.2 },
    { name: 'Greek Yogurt (0% plain)',       p: 10,  c: 3.6,  f: 0.4 },
    { name: 'Greek Yogurt (2% plain)',       p: 9.7, c: 3.7,  f: 2   },
    { name: 'Cottage Cheese (low fat)',      p: 11,  c: 3.4,  f: 1   },
    { name: 'Protein Powder (whey)',         p: 80,  c: 8,    f: 4   },
    { name: 'Whole Milk',                    p: 3.2, c: 4.8,  f: 3.3 },
    { name: 'Skim Milk',                     p: 3.4, c: 5,    f: 0.1 },
    { name: 'Cheddar Cheese',               p: 25,  c: 1.3,  f: 33  },
    { name: 'Mozzarella Cheese',            p: 22,  c: 2.2,  f: 22  },
    { name: 'White Rice (cooked)',           p: 2.7, c: 28,   f: 0.3 },
    { name: 'Brown Rice (cooked)',           p: 2.6, c: 23,   f: 0.9 },
    { name: 'Oats (dry)',                    p: 13,  c: 67,   f: 7   },
    { name: 'Pasta (cooked)',                p: 5,   c: 25,   f: 0.9 },
    { name: 'White Bread',                   p: 9,   c: 49,   f: 3.2 },
    { name: 'Whole Wheat Bread',             p: 9,   c: 41,   f: 3.4 },
    { name: 'Bagel (plain)',                 p: 10,  c: 53,   f: 1.5 },
    { name: 'Flour Tortilla',               p: 7,   c: 48,   f: 8   },
    { name: 'Sweet Potato (cooked)',         p: 1.6, c: 20,   f: 0.1 },
    { name: 'White Potato (cooked)',         p: 2,   c: 17,   f: 0.1 },
    { name: 'Banana',                        p: 1.1, c: 23,   f: 0.3 },
    { name: 'Apple',                         p: 0.3, c: 14,   f: 0.2 },
    { name: 'Orange',                        p: 0.9, c: 12,   f: 0.1 },
    { name: 'Blueberries',                   p: 0.7, c: 14,   f: 0.3 },
    { name: 'Strawberries',                  p: 0.7, c: 8,    f: 0.3 },
    { name: 'Grapes',                        p: 0.6, c: 18,   f: 0.2 },
    { name: 'Avocado',                       p: 2,   c: 9,    f: 15  },
    { name: 'Broccoli (cooked)',             p: 2.8, c: 5,    f: 0.5 },
    { name: 'Spinach (raw)',                 p: 2.9, c: 3.6,  f: 0.4 },
    { name: 'Kale (raw)',                    p: 4.3, c: 8.8,  f: 0.9 },
    { name: 'Bell Pepper',                   p: 1,   c: 6,    f: 0.3 },
    { name: 'Cucumber',                      p: 0.7, c: 3.6,  f: 0.1 },
    { name: 'Tomato',                        p: 0.9, c: 3.9,  f: 0.2 },
    { name: 'Carrot',                        p: 0.9, c: 10,   f: 0.2 },
    { name: 'Peanut Butter',                 p: 25,  c: 20,   f: 50  },
    { name: 'Almond Butter',                 p: 21,  c: 19,   f: 56  },
    { name: 'Almonds',                       p: 21,  c: 22,   f: 49  },
    { name: 'Walnuts',                       p: 15,  c: 14,   f: 65  },
    { name: 'Cashews',                       p: 18,  c: 30,   f: 44  },
    { name: 'Olive Oil',                     p: 0,   c: 0,    f: 100 },
    { name: 'Butter',                        p: 0.9, c: 0.1,  f: 81  },
    { name: 'Black Beans (cooked)',          p: 8.9, c: 23,   f: 0.5 },
    { name: 'Chickpeas (cooked)',            p: 8.9, c: 27,   f: 2.6 },
    { name: 'Lentils (cooked)',              p: 9,   c: 20,   f: 0.4 },
    { name: 'Edamame',                       p: 11,  c: 8.9,  f: 5   },
    { name: 'Tofu (firm)',                   p: 8,   c: 1.9,  f: 4.8 },
  ];

  let selectedFood = null;
  let acHighlight = -1;
  let amountUnit = 'g';

  function setUnit(u) {
    amountUnit = u;
    document.getElementById('btnG').classList.toggle('active', u === 'g');
    document.getElementById('btnOz').classList.toggle('active', u === 'oz');
    estimateMacros();
  }

  function filterFoods(q) {
    if (!q || q.length < 2) return [];
    const lower = q.toLowerCase();
    return FOODS.filter(f => f.name.toLowerCase().includes(lower)).slice(0, 8);
  }

  function renderDrop(items) {
    const drop = document.getElementById('autocompleteDrop');
    if (!items.length) { drop.classList.remove('open'); return; }
    drop._items = items;
    acHighlight = -1;
    drop.innerHTML = items.map((f, i) =>
      `<div class="ac-item" data-i="${i}">${f.name}</div>`
    ).join('');
    drop.classList.add('open');
  }

  function closeDrop() {
    document.getElementById('autocompleteDrop').classList.remove('open');
    acHighlight = -1;
  }

  function pickFood(food) {
    selectedFood = food;
    document.getElementById('foodName').value = food.name;
    closeDrop();
    estimateMacros();
    document.getElementById('foodAmount').focus();
  }

  function estimateMacros() {
    if (!selectedFood) return;
    const raw = parseFloat(document.getElementById('foodAmount').value);
    if (!raw) return;
    const g = amountUnit === 'oz' ? raw * 28.3495 : raw;
    const f = g / 100;
    document.getElementById('inP').value = +(selectedFood.p * f).toFixed(1);
    document.getElementById('inC').value = +(selectedFood.c * f).toFixed(1);
    document.getElementById('inF').value = +(selectedFood.f * f).toFixed(1);
    updateCalPreview();
  }

  const KEY_LOG   = 'macro_log';
  const KEY_GOALS = 'macro_goals';
  const KEY_DATE  = 'macro_date';

  let entries = [];
  let goals = { p: 150, c: 200, f: 65, k: 2000 };

  function todayStr() {
    return new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
  }

  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }

  function init() {
    document.getElementById('dateLabel').textContent = todayStr();

    // Check if a new day — reset log if so
    const savedDate = localStorage.getItem(KEY_DATE);
    const today = todayKey();
    if (savedDate !== today) {
      localStorage.removeItem(KEY_LOG);
      localStorage.setItem(KEY_DATE, today);
    }

    const rawLog = localStorage.getItem(KEY_LOG);
    entries = rawLog ? JSON.parse(rawLog) : [];

    const rawGoals = localStorage.getItem(KEY_GOALS);
    if (rawGoals) goals = JSON.parse(rawGoals);

    document.getElementById('goalP').value = goals.p;
    document.getElementById('goalC').value = goals.c;
    document.getElementById('goalF').value = goals.f;
    document.getElementById('goalK').value = goals.k;

    render();
  }

  function saveGoals() {
    goals = {
      p: parseFloat(document.getElementById('goalP').value) || 0,
      c: parseFloat(document.getElementById('goalC').value) || 0,
      f: parseFloat(document.getElementById('goalF').value) || 0,
      k: parseFloat(document.getElementById('goalK').value) || 0,
    };
    try { localStorage.setItem(KEY_GOALS, JSON.stringify(goals)); } catch(e) {}
    render();
  }

  function saveLog() {
    try { localStorage.setItem(KEY_LOG, JSON.stringify(entries)); } catch(e) {}
  }

  function addEntry() {
    const name = document.getElementById('foodName').value.trim() || 'Food';
    const p = parseFloat(document.getElementById('inP').value) || 0;
    const c = parseFloat(document.getElementById('inC').value) || 0;
    const f = parseFloat(document.getElementById('inF').value) || 0;
    const k = Math.round(p * 4 + c * 4 + f * 9);

    if (!document.getElementById('foodName').value.trim() && p === 0 && c === 0 && f === 0) return;

    entries.push({ id: Date.now(), name, p, c, f, k });
    saveLog();
    render();

    document.getElementById('foodName').value = '';
    document.getElementById('foodAmount').value = '';
    document.getElementById('inP').value = '';
    document.getElementById('inC').value = '';
    document.getElementById('inF').value = '';
    document.getElementById('calPreview').innerHTML = '';
    selectedFood = null;
    closeDrop();
  }

  function deleteEntry(id) {
    entries = entries.filter(e => e.id !== id);
    saveLog();
    render();
  }

  function clearLog() {
    if (!entries.length) return;
    entries = [];
    saveLog();
    render();
  }

  function updateCalPreview() {
    const p = parseFloat(document.getElementById('inP').value) || 0;
    const c = parseFloat(document.getElementById('inC').value) || 0;
    const f = parseFloat(document.getElementById('inF').value) || 0;
    const k = Math.round(p * 4 + c * 4 + f * 9);
    const el = document.getElementById('calPreview');
    if (p || c || f) {
      el.innerHTML = `≈ <span>${k} kcal</span>`;
    } else {
      el.innerHTML = '';
    }
  }

  function toggleGoals() {
    const panel = document.getElementById('goalsPanel');
    const arrow = document.getElementById('goalsArrow');
    const open = panel.classList.toggle('open');
    arrow.textContent = open ? '▾' : '▸';
  }

  function fmt(n) { return Math.round(n); }

  function pct(val, goal) {
    if (!goal) return 0;
    return Math.min(100, Math.round((val / goal) * 100));
  }

  function remLabel(val, goal) {
    if (!goal) return '';
    const rem = Math.round(goal - val);
    return rem >= 0 ? `${rem}g left` : `${Math.abs(rem)}g over`;
  }

  function remLabelKcal(val, goal) {
    if (!goal) return '';
    const rem = Math.round(goal - val);
    return rem >= 0 ? `${rem} left` : `${Math.abs(rem)} over`;
  }

  function render() {
    const totP = entries.reduce((s, e) => s + e.p, 0);
    const totC = entries.reduce((s, e) => s + e.c, 0);
    const totF = entries.reduce((s, e) => s + e.f, 0);
    const totK = entries.reduce((s, e) => s + e.k, 0);

    document.getElementById('totP').textContent = fmt(totP);
    document.getElementById('totC').textContent = fmt(totC);
    document.getElementById('totF').textContent = fmt(totF);
    document.getElementById('totKcal').textContent = fmt(totK);

    document.getElementById('remP').textContent = remLabel(totP, goals.p);
    document.getElementById('remC').textContent = remLabel(totC, goals.c);
    document.getElementById('remF').textContent = remLabel(totF, goals.f);
    document.getElementById('remKcal').textContent = remLabelKcal(totK, goals.k);

    const pp = pct(totP, goals.p), cp = pct(totC, goals.c), fp = pct(totF, goals.f), kp = pct(totK, goals.k);
    document.getElementById('barP').style.width = pp + '%';
    document.getElementById('barC').style.width = cp + '%';
    document.getElementById('barF').style.width = fp + '%';
    document.getElementById('barK').style.width = kp + '%';
    document.getElementById('pctP').textContent = pp + '%';
    document.getElementById('pctC').textContent = cp + '%';
    document.getElementById('pctF').textContent = fp + '%';
    document.getElementById('pctK').textContent = kp + '%';

    const area = document.getElementById('logArea');
    if (!entries.length) {
      area.innerHTML = '<div class="log-empty">No entries yet — add your first food above.</div>';
      return;
    }

    area.innerHTML = '<div class="log-list">' + [...entries].reverse().map(e => `
      <div class="log-item">
        <span class="log-item-name">${escHtml(e.name)}</span>
        <div class="log-item-macros">
          <span class="log-macro c-protein">${fmt(e.p)}p</span>
          <span class="log-macro c-carbs">${fmt(e.c)}c</span>
          <span class="log-macro c-fat">${fmt(e.f)}f</span>
        </div>
        <span class="log-item-cal">${e.k} kcal</span>
        <button class="btn-del" onclick="deleteEntry(${e.id})" aria-label="Delete">×</button>
      </div>
    `).join('') + '</div>';
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Food name autocomplete
  document.getElementById('foodName').addEventListener('input', e => {
    selectedFood = null;
    renderDrop(filterFoods(e.target.value));
  });

  document.getElementById('foodName').addEventListener('keydown', e => {
    const drop = document.getElementById('autocompleteDrop');
    const items = drop._items || [];
    if (drop.classList.contains('open') && items.length) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        acHighlight = Math.min(acHighlight + 1, items.length - 1);
        drop.querySelectorAll('.ac-item').forEach((el, i) => el.classList.toggle('highlighted', i === acHighlight));
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        acHighlight = Math.max(acHighlight - 1, 0);
        drop.querySelectorAll('.ac-item').forEach((el, i) => el.classList.toggle('highlighted', i === acHighlight));
        return;
      }
      if (e.key === 'Enter' && acHighlight >= 0) {
        e.preventDefault();
        pickFood(items[acHighlight]);
        return;
      }
    }
    if (e.key === 'Escape') { closeDrop(); return; }
    if (e.key === 'Enter') document.getElementById('foodAmount').focus();
  });

  document.getElementById('autocompleteDrop').addEventListener('click', e => {
    const item = e.target.closest('.ac-item');
    if (!item) return;
    const drop = document.getElementById('autocompleteDrop');
    pickFood(drop._items[+item.dataset.i]);
  });

  document.getElementById('foodAmount').addEventListener('input', estimateMacros);
  document.getElementById('foodAmount').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('inP').focus();
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.food-search-wrap')) closeDrop();
  });

  ['inP','inC','inF'].forEach((id, i, arr) => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (i < arr.length - 1) document.getElementById(arr[i+1]).focus();
        else addEntry();
      }
    });
  });

  init();
</script>
</body>
</html>
